# À placer dans .github/workflows/data.yml
name: Flux de données CryptoO2

on:
  schedule:
    - cron: "7 * * * *"   # toutes les heures, à la minute 7
  workflow_dispatch:        # et à la demande, depuis l'onglet Actions

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websocket-client
      - name: Récupérer les bougies
        run: python fetch_data.py
        continue-on-error: true   # on enregistre ce qui a marché même si un actif échoue
      - name: Enregistrer les fichiers
        run: |
          git config user.name "cryptoo2-data"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Données $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
